[package]
name = "svgo"
version = "0.1.0"
edition = "2021"
publish = false
description = "SuperUtils SVG optimiser for wasm32: OXVG (Rust port of SVGO's preset-default)"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
oxvg_ast = { version = "0.0.9", features = ["roxmltree"] }
oxvg_optimiser = "0.0.9"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
