[package]
name = "textkit"
version = "0.1.0"
edition = "2021"
publish = false
description = "SuperTools text engine for wasm32: counting words, characters, sentences, paragraphs and lines on Unicode's own segmentation rules (UAX #29)"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
unicode-segmentation = "1.13.3"
similar = { version = "3.2.1", default-features = false, features = ["std", "text", "inline", "unicode"], optional = true }
lipsum = { version = "0.9.1", optional = true }
rand = { version = "0.8.5", default-features = false, features = ["alloc"], optional = true }
rand_chacha = { version = "0.3.1", default-features = false, optional = true }

# One module per group of tabs (as wasm/devcore does), so that a tab fetches only its own engine:
#   text  → textkit.wasm       Word Counter, Case Converter, Line Tools ("By length")
#   diff  → textkit-diff.wasm  Text Diff
#   lorem → textkit-lorem.wasm Lorem Ipsum (the lipsum crate's Markov chain)
[features]
default = ["text"]
text = []
diff = ["dep:similar"]
lorem = ["dep:lipsum", "dep:rand", "dep:rand_chacha"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
