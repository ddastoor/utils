[package]
name = "textkit"
version = "0.1.0"
edition = "2021"
publish = false
description = "SuperTools text engine for wasm32: counting words, characters, sentences, paragraphs and lines on Unicode's own segmentation rules (UAX #29)"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
unicode-segmentation = "1.13.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
