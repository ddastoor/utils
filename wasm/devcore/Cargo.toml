[package]
name = "devcore"
version = "0.1.0"
edition = "2021"
publish = false
description = "SuperTools developer-tool engine for wasm32: CIDR, cron, semver, glob, base encodings, binary decoders, X.509, patch, SQL formatting, hex dump"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
bs58 = "0.5.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
chrono-tz = { version = "0.10.4", default-features = false }
ciborium = "0.2.2"
croner = "4.0.3"
data-encoding = "2.11.1"
diffy = "0.5.2"
globset = "0.4.21"
ipnet = "2.12.2"
nodejs-semver = "7.0.0"
rmpv = "1.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlformat = "0.5.0"
x509-parser = "0.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
