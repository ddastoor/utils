[package]
name = "devcore"
version = "0.1.0"
edition = "2021"
publish = false
description = "SuperTools developer-tool engine for wasm32: CIDR, cron, semver, glob, base encodings, binary decoders, X.509, patch, SQL formatting, hex dump"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
bs58 = { version = "0.5.1", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"], optional = true }
ciborium = { version = "0.2.2", optional = true }
croner = { version = "4.0.3", optional = true }
data-encoding = { version = "2.11.1", optional = true }
diffy = { version = "0.5.2", optional = true }
globset = { version = "0.4.21", optional = true }
ipnet = { version = "2.12.2", optional = true }
json-patch = { version = "5.0.0", optional = true, default-features = false, features = ["diff"] }
regex-lite = { version = "0.1", optional = true }
rmpv = { version = "1.3.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
sqlformat = { version = "0.5.0", optional = true }
x509-parser = { version = "0.18.1", optional = true }

[features]
# one small wasm per tab: build.sh builds each feature on its own (devcore-<feature>.wasm)
cidr = ["dep:ipnet"]
cron = ["dep:croner", "dep:chrono"]
semver = ["dep:regex-lite"]
glob = ["dep:globset"]
patch = ["dep:diffy"]
sqlfmt = ["dep:sqlformat"]
x509 = ["dep:x509-parser", "dep:sha1", "dep:sha2"]
enc = ["dep:data-encoding", "dep:bs58", "dep:sha2"]
bin = ["dep:rmpv", "dep:ciborium", "dep:chrono", "enc"]
hex = []
jsondiff = ["dep:json-patch"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
