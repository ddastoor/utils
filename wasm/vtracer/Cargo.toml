[package]
name = "vtracer-module"
version = "0.1.0"
edition = "2021"
publish = false
description = "SuperUtils colour tracing: visioncortex VTracer 0.6.5 (MIT OR Apache-2.0) as plain exports for wasm32 — a picture's pixels in, an SVG out"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vtracer = { version = "=0.6.5", default-features = false }
visioncortex = "=0.8.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
