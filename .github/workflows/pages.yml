name: Deploy to GitHub Pages

# The site is published from main (owner, 26 Nov 2026: "merge the branch to main, push main, and start making subsequent
# changes to main, and also … make the site live off of main"); work is committed to main from then on.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one queue per branch
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test   # unit suites (e2e needs a browser; run locally)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    # main publishes. GitHub's github-pages environment must allow main to deploy (Settings → Environments → github-pages
    # → Deployment branches and tags: add main) — until then this job is refused there and the site stays as it was
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
