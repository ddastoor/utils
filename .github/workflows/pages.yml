name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/exciting-bohr-b9yfwc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one queue per branch: a build of main never cancels the publishing run of the default branch
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test   # unit suites (e2e needs a browser; run locally)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    # Pages' github-pages environment lets only the repository's default branch publish; other branches build and test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
