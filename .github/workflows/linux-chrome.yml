# The browser suites in Google Chrome on Linux — the owner's browser on the owner's other system. The sandbox where SuperUtils is
# built tests Playwright's Chromium (a few versions behind the Chrome people run); this runs the newest stable Chrome that GitHub's
# Ubuntu runner carries. Run by hand (Actions → "Linux Chrome check" → Run workflow, or the API); a list of suites narrows it (names
# or parts of names, as `node tests/e2e.mjs` takes them). Found the need: the Windows check, run 21 — Chrome 158 gives a private
# window the quota of a normal one, and the Settings page's folder handle is read back there (Chromium 153 on Linux closed itself).
name: Linux Chrome check

on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'e2e suites to run (space-separated names or parts of names; empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-chrome-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-linux-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # the Playwright the suites are written for; the browser is the runner's own Google Chrome (channel "chrome")
      - run: npm install --no-save playwright@1.63.0
      - name: Browser suites in Chrome on Linux
        env:
          E2E_CHANNEL: chrome
          E2E_CONCURRENCY: '4'
        run: |
          google-chrome --version || true
          node tests/e2e.mjs ${{ inputs.suites }} 2>&1 | tee e2e-linux-chrome.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux-chrome
          path: e2e-linux-chrome.txt
